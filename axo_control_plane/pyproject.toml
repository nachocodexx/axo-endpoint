[tool.poetry]
name = "axo_control_plane"
version = "0.1.0"
description = "The axo Control Plane -- people, plans, Virtual Environments, the front door, metering intake, sleeping and cleanup"
authors = ["Ignacio Castillo <ignacio.bcastillo@gmail.com>"]

[tool.poetry.dependencies]
python = ">=3.10,<4"
fastapi = "^0.143.3"
uvicorn = {extras = ["standard"], version = "^0.54.0"}
httpx = "^0.28.1"
websockets = "^16.1.1"
pyzmq = "^27.2.0"
pymongo = "^4.18.3"
kurrentdbclient = "^1.3.4"
option = ">=2.1.0,<3.0.0"
python-dotenv = "^1.2.4"
rich = "^15.0.0"
docker = "^7.2.0"
python-multipart = "^0.0.32"
axo_shared = {path = "../axo_shared", develop = true}
xolo = "0.1.0a8"

[tool.poetry.scripts]
axo-control-plane = "axo_control_plane.cli:main"

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
mongomock = "^4.3.0"
pytest-cov = "^7.1.0"
axo_storage = {path = "../axo_storage", develop = true}

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[[tool.poetry.source]]
name = "test"
url = "https://test.pypi.org/simple/"
priority = "supplemental"
