# The platform (upgrade.md 6.8), deployed once by the Platform Admin:
#   axo_control_plane + its Kurrent + Mongo, axo_storage, xolo (+ Mongo,
#   Redis). Every VE (VEM + Kurrent + Mongo + endpoints) is created later by
#   the Control Plane, on its own network.
#
#   docker compose -f platform.compose.yml --env-file deploy/env/compose.env up -d --build
#
# The VEM and endpoint images must exist on the host first (the CP starts
# them per VE): docker compose build axo-vem axo-endpoint-0
# (tags AXO_CP_VEM_IMAGE / AXO_CP_ENDPOINT_IMAGE in axo.control-plane.prod.env).

services:
  cp-kurrentdb:
    image: eventstore/eventstore:${AXO_KURRENTDB_IMAGE_TAG:-24.10.0-jammy}
    restart: unless-stopped
    env_file: [./deploy/env/axo.kurrentdb.prod.env]
    command: ["--insecure", "--ext-ip", "0.0.0.0"]
    volumes:
      - axo-cp-kurrentdb-data:/var/lib/eventstore
    networks: [axo-control-net]

  cp-mongo:
    image: mongo:${AXO_CP_MONGO_IMAGE_TAG:-7}
    restart: unless-stopped
    volumes:
      - axo-cp-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [axo-control-net]

  axo-storage:
    build:
      context: .
      dockerfile: axo_storage/Dockerfile
    image: ${AXO_STORAGE_IMAGE:-axo-storage:local}
    container_name: axo-storage          # the CP attaches it to every VE network by this name
    restart: unless-stopped
    env_file: [./deploy/env/axo.storage.platform.env]
    volumes:
      - axo-storage-data:/data
    networks: [axo-control-net]

  axo-control-plane:
    build:
      context: .
      dockerfile: axo_control_plane/Dockerfile
    image: ${AXO_CP_IMAGE:-axo-control-plane:local}
    container_name: axo-control-plane
    restart: unless-stopped
    env_file: [./deploy/env/axo.control-plane.prod.env]
    ports:
      - "${AXO_CP_PUBLIC_PORT:-9000}:9000"
    volumes:
      # Creates and removes the VE containers and networks.
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      cp-mongo:
        condition: service_healthy
      cp-kurrentdb:
        condition: service_started
      xolo:
        condition: service_healthy
    networks: [axo-control-net]

  xolo-db:
    image: mongo:${XOLO_MONGO_IMAGE_TAG:-8-noble}
    restart: unless-stopped
    env_file: [./deploy/env/mongodb.env]
    volumes:
      - xolo-mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [axo-control-net]

  xolo-cache:
    image: redis:${XOLO_REDIS_IMAGE_TAG:-7.0.11-alpine}
    restart: unless-stopped
    env_file: [./deploy/env/redis.env]
    volumes:
      - xolo-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [axo-control-net]

  xolo:
    image: ${XOLO_IMAGE:-xolo-api:latest}
    restart: unless-stopped
    env_file: [./deploy/env/app.prod.env]
    command: uvicorn xoloapi.server:app --host 0.0.0.0 --port 10000 --proxy-headers --forwarded-allow-ips=*
    depends_on:
      xolo-db:
        condition: service_healthy
      xolo-cache:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:10000/openapi.json')"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks: [axo-control-net]

networks:
  # The CP and every VEM (never the endpoints): its fixed name is what the
  # CP attaches each VEM to.
  axo-control-net:
    name: axo-control-net

volumes:
  axo-cp-kurrentdb-data:
  axo-cp-mongo-data:
  axo-storage-data:
  xolo-mongodb-data:
  xolo-redis-data:
