[tool.poetry]
name = "axo_endpoint"
version = "0.1.0"
description = ""
authors = ["Ignacio Castillo <ignacio.bcastillo@gmail.com>"]
readme = "README.md"


[tool.poetry.scripts]
axo-endpoint         = "axo_endpoint.cli:main"
axo-endpoint-client  = "axo_endpoint.client_cli:main"
axec                 = "axo_endpoint.client_cli:main"

[tool.poetry.dependencies]
python = ">=3.10,<4"
# Held below the latest (2.5): rory (dev: examples/02_encrypt.py, the HE
# calibration bench) needs numpy <= 2.2.4; numpy 2.3+ also needs Python 3.11.
numpy = ">=2.2.4,<=2.2.4"
pyzmq = "^27.0.0"
cloudpickle = "^3.1.2"
aiofiles = "^25.1.0"
python-dotenv = "^1.2.4"
# Held below the latest (50.x): xolo 0.1.0a8 (newest) needs cryptography < 43.
cryptography = ">=42.0.5,<43"
pika = "^1.4.4"
# matplotlib 3.11 / pillow 13 need Python 3.11: newest for 3.10.
matplotlib = "^3.10.9"
pillow = "^12.3.0"
rich = "^15.0.0"
docker = "^7.2.0"
fastapi = "^0.143.3"
uvicorn = {version = "^0.54.0", extras = ["standard"]}
requests = "^2.34.2"
# pandas 3 needs Python 3.11: newest for 3.10.
pandas = {version = "^2.3.3", optional = true}
axo_shared = {path = "axo_shared", develop = true}
# Runs Axo classes and @axo_function code (worker processes, runner images).
axo = {path = "axo", develop = true}
# Object state backends (each VE's Mongo + Redis).
# pymongo 4.19+ needs Python 3.11: newest for 3.10.
pymongo = "^4.18.3"
xolo = {version = "0.1.0a8", source = "test"}
redis = "^8.1.0"
rory = {version = "0.1.14", source = "test"}

[tool.poetry.extras]
pandas = ["pandas"]

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
galois = "^0.4.11"
pytest-asyncio = "^1.4.0"
rory = {version = "0.1.14", source = "test"}
pytest-cov = "^7.1.0"
axo_storage = {path = "axo_storage", develop = true}
mongomock = "^4.3.0"
fakeredis = "^2.40.0"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[[tool.poetry.source]]
name = "test"
url = "https://test.pypi.org/simple/"
priority = "supplemental"

