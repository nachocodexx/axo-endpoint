# The axo platform, deployed once by the Platform Admin:
#   axo-control-plane (+ its Kurrent and Mongo), axo-storage, xolo (+ Mongo,
#   Redis, admin UI) and axo-ui. Every VE (its VEM, Kurrent, Mongo, Redis and
#   endpoints) is created later by the Control Plane, on its own network.
#
#   ./deploy.sh up --build      (preferred: also builds the images below)
#
# or by hand:
#   docker compose --env-file deploy/env/compose.env --profile images build
#   docker compose --env-file deploy/env/compose.env up -d --build
#
# The "images" profile only builds the images the Control Plane starts for
# each VE (VEM, endpoint, runner); those are never started by compose.
#
# On the host:
#   axo-ui            http://localhost:3080   (the people's app)
#   axo-control-plane http://localhost:9000   (the API, /docs)
#   xolo-ui           http://127.0.0.1:3001   (accounts, Platform Admin)
#   xolo API          http://127.0.0.1:10000

services:
  # --- the Control Plane ------------------------------------------------------
  cp-kurrentdb:
    image: eventstore/eventstore:${AXO_KURRENTDB_IMAGE_TAG:-24.10.0-jammy}
    restart: unless-stopped
    env_file: [./deploy/env/axo.kurrentdb.prod.env]
    command: ["--insecure", "--ext-ip", "0.0.0.0"]
    volumes:
      - axo-cp-kurrentdb-data:/var/lib/eventstore
    networks: [axo-control-net]

  cp-mongo:
    image: mongo:${AXO_CP_MONGO_IMAGE_TAG:-7}
    restart: unless-stopped
    volumes:
      - axo-cp-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [axo-control-net]

  axo-control-plane:
    build:
      context: .
      dockerfile: axo_control_plane/Dockerfile
    image: ${AXO_CP_IMAGE:-axo-control-plane:local}
    container_name: axo-control-plane
    restart: unless-stopped
    env_file: [./deploy/env/axo.control-plane.prod.env]
    ports:
      - "${AXO_CP_PUBLIC_PORT:-9000}:9000"
    volumes:
      # Creates and removes the VE containers and networks.
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      cp-mongo:
        condition: service_healthy
      cp-kurrentdb:
        condition: service_started
      xolo:
        condition: service_healthy
    networks: [axo-control-net]

  # --- buckets --------------------------------------------------------------
  axo-storage:
    build:
      context: .
      dockerfile: axo_storage/Dockerfile
    image: ${AXO_STORAGE_IMAGE:-axo-storage:local}
    container_name: axo-storage          # the CP attaches it to every VE network by this name
    restart: unless-stopped
    env_file: [./deploy/env/axo.storage.platform.env]
    volumes:
      - axo-storage-data:/data
    networks: [axo-control-net]

  # --- the people's app -----------------------------------------------------
  # The browser calls the Control Plane at AXO_UI_API_BASE.
  axo-ui:
    build:
      context: .
      dockerfile: axo-ui/Dockerfile
    image: ${AXO_UI_IMAGE:-axo-ui:local}
    container_name: axo-ui
    restart: unless-stopped
    environment:
      NUXT_PUBLIC_API_BASE: ${AXO_UI_API_BASE:-http://localhost:9000}
      # Its own server renders pages too: it reaches the CP inside the network.
      NUXT_API_BASE_SERVER: http://axo-control-plane:9000
    ports:
      - "${AXO_UI_PUBLIC_PORT:-3080}:3000"
    depends_on:
      - axo-control-plane
    networks: [axo-control-net]

  # --- xolo (published images nachocode/xolo:api-<v> / ui-<v>) -------------
  # Only the CP talks to Xolo, so its Mongo/Redis publish no ports and the
  # API only on 127.0.0.1 (the admin UI's browser calls it).
  # Mongo is a one-member replica set (xolo-rs, set up by xolo-db-init):
  # Xolo uses transactions for group changes.
  xolo-db:
    image: mongo:${XOLO_MONGO_IMAGE_TAG:-8-noble}
    restart: unless-stopped
    env_file: [./deploy/env/mongodb.env]
    command: ["mongod", "--config", "/etc/mongo/mongod.conf"]
    volumes:
      - xolo-mongodb-data:/data/db
      - ./deploy/xolo/mongod.conf:/etc/mongo/mongod.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks: [axo-control-net]

  xolo-db-init:
    image: mongo:${XOLO_MONGO_IMAGE_TAG:-8-noble}
    depends_on:
      xolo-db:
        condition: service_healthy
    command:
      - sh
      - -ec
      - |
        mongosh --host xolo-db:27017 --quiet --eval '
          try { rs.status() }
          catch (error) { rs.initiate({_id: "xolo-rs", members: [{_id: 0, host: "xolo-db:27017"}]}) }
          while (!db.hello().isWritablePrimary) { sleep(500) }
        '
    restart: "no"
    networks: [axo-control-net]

  xolo-cache:
    image: redis:${XOLO_REDIS_IMAGE_TAG:-7.0.11-alpine}
    restart: unless-stopped
    env_file: [./deploy/env/redis.env]
    command:
      - sh
      - -ec
      - |
        if [ -n "$${REDIS_REQUIREPASS}" ]; then
          exec redis-server --appendonly "$${REDIS_APPENDONLY}" --save "$${REDIS_SAVE}" --requirepass "$${REDIS_REQUIREPASS}"
        fi
        exec redis-server --appendonly "$${REDIS_APPENDONLY}" --save "$${REDIS_SAVE}"
    volumes:
      - xolo-redis-data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "if [ -n \"$${REDIS_REQUIREPASS}\" ]; then redis-cli -a \"$${REDIS_REQUIREPASS}\" ping; else redis-cli ping; fi",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [axo-control-net]

  xolo:
    image: ${XOLO_IMAGE:-nachocode/xolo:api-0.1.0a8}
    restart: unless-stopped
    env_file: [./deploy/env/app.prod.env]
    command:
      - uvicorn
      - xoloapi.server:app
      - --host
      - 0.0.0.0
      - --port
      - "10000"
      - --proxy-headers
      - --forwarded-allow-ips=*
      - --log-level
      - ${XOLO_UVICORN_LOG_LEVEL:-info}
    ports:
      - "127.0.0.1:${XOLO_API_PUBLIC_PORT:-10000}:10000"
    volumes:
      - xolo-data:/xolo
      - xolo-logs:/app/log
    depends_on:
      xolo-db:
        condition: service_healthy
      xolo-db-init:
        condition: service_completed_successfully
      xolo-cache:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:10000/openapi.json', timeout=5).read()",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [axo-control-net]

  # Xolo's admin UI (Platform Admin only); the browser calls the API at
  # XOLO_UI_API_BASE, so its origin must be in XOLO_CORS_ALLOW_ORIGINS.
  xolo-ui:
    image: ${XOLO_UI_IMAGE:-nachocode/xolo:ui-0.1.0a8}
    restart: unless-stopped
    environment:
      NUXT_PUBLIC_API_BASE: ${XOLO_UI_API_BASE:-http://localhost:10000/api/v4}
      NUXT_PUBLIC_VERSION: ${XOLO_VERSION:-0.1.0a8}
      HOST: 0.0.0.0
      PORT: 3000
    ports:
      - "127.0.0.1:${XOLO_UI_PUBLIC_PORT:-3001}:3000"
    depends_on:
      xolo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [axo-control-net]

  # --- images the Control Plane starts for each VE (built, never started) ----
  axo-vem-image:
    profiles: ["images"]
    build:
      context: .
      dockerfile: axo_vem/Dockerfile
    image: ${AXO_VEM_IMAGE:-axo-vem:local}

  axo-endpoint-image:
    profiles: ["images"]
    build:
      context: .
      dockerfile: Dockerfile
    image: ${AXO_ENDPOINT_IMAGE:-axo-endpoint:local}

  # An endpoint builds a runner image itself the first time a function asks
  # for one; building it here saves that wait (tag = AXO_ENDPOINT_RUNNER_IMAGE
  # :py<version>, matching the endpoint's own naming).
  axo-runner-image:
    profiles: ["images"]
    build:
      context: .
      dockerfile: axo_endpoint/runner/Dockerfile
      args:
        PYTHON_VERSION: ${AXO_ENDPOINT_RUNNER_PYTHON_VERSION:-3.11}
    image: ${AXO_ENDPOINT_RUNNER_IMAGE:-axo-runner}:py${AXO_ENDPOINT_RUNNER_PYTHON_VERSION:-3.11}

networks:
  # The CP and every VEM (never the endpoints): its fixed name is what the
  # CP attaches each VEM to.
  axo-control-net:
    name: axo-control-net

# Fixed names, so the data outlives the compose project (and the Xolo
# account the Control Plane's key belongs to is kept).
volumes:
  axo-cp-kurrentdb-data:
    name: axo-cp-kurrentdb-data
  axo-cp-mongo-data:
    name: axo-cp-mongo-data
  axo-storage-data:
    name: axo-platform-storage-data
  xolo-mongodb-data:
    name: xolo-mongodb-data
  xolo-redis-data:
    name: xolo-redis-data
  xolo-data:
    name: xolo-data
  xolo-logs:
    name: xolo-logs
